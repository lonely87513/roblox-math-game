<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🎮 Roblox 數學大冒險</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================
           1. 設計語彙（Design Tokens）
           所有顏色、圓角、陰影、間距集中管理，方便日後統一調整
           ========================================================== */
        :root {
            --font-display: 'Fredoka One', 'Comic Sans MS', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;

            /* 背景與外殼 */
            --c-bg-top: #1a1a2e;
            --c-bg-mid: #16213e;
            --c-bg-bottom: #0f3460;
            --c-shell-top: #00d4ff;
            --c-shell-bottom: #0099cc;
            --c-ring-gold: #ffd700;
            --c-ring-flame: #ff6b35;

            /* 表面 */
            --c-surface: #ffffff;
            --c-surface-2: #f2f5fa;
            --c-surface-3: #e2e8f2;
            --c-panel: rgba(255, 255, 255, 0.96);
            --c-tint-blue-1: #f0f8ff;
            --c-tint-blue-2: #e0f0ff;

            /* 文字 */
            --c-ink: #1d2333;
            --c-ink-soft: #5b6478;
            --c-ink-invert: #ffffff;
            --c-gold-ink: #5a3d00;

            /* 主色與狀態色 */
            --c-primary: #00c2f2;
            --c-primary-deep: #0099cc;
            --c-accent: #ff6b35;
            --c-accent-deep: #dd5525;
            --c-gold: #ffd700;
            --c-gold-deep: #cc8800;
            --c-success: #00e58a;
            --c-success-deep: #00b866;
            --c-success-soft: #e2fff2;
            --c-danger: #ff6b6b;
            --c-danger-soft: #ffecec;
            --c-warning: #ffc93c;
            --c-warning-deep: #e0a800;
            --c-warning-soft: #fff8e2;
            --c-purple: #a855f7;
            --c-purple-deep: #7c3aed;
            --c-pink: #ff69b4;
            --c-pink-deep: #ff1493;
            --c-focus: #12284a;

            /* 漸層 */
            --grad-primary: linear-gradient(180deg, var(--c-primary), var(--c-primary-deep));
            --grad-accent: linear-gradient(180deg, var(--c-accent), var(--c-accent-deep));
            --grad-success: linear-gradient(180deg, var(--c-success), var(--c-success-deep));
            --grad-gold: linear-gradient(180deg, var(--c-gold), #ffaa00);
            --grad-purple: linear-gradient(180deg, var(--c-purple), var(--c-purple-deep));
            --grad-pink: linear-gradient(180deg, var(--c-pink), var(--c-pink-deep));

            /* 圓角 */
            --r-sm: 12px;
            --r-md: 16px;
            --r-lg: 22px;
            --r-xl: 30px;
            --r-pill: 999px;

            /* 陰影 */
            --shadow-1: 0 4px 10px rgba(9, 20, 45, 0.18);
            --shadow-2: 0 8px 20px rgba(9, 20, 45, 0.24);
            --shadow-3: 0 20px 60px rgba(0, 0, 0, 0.4);

            /* 字級層級：全部使用 rem + clamp()，不受父層 em 影響 */
            --fs-xs: clamp(0.75rem, 0.72rem + 0.16vw, 0.8125rem);
            --fs-sm: clamp(0.8125rem, 0.79rem + 0.2vw, 0.9375rem);
            --fs-md: clamp(0.9375rem, 0.9rem + 0.22vw, 1.0625rem);
            --fs-lg: clamp(1.0625rem, 1rem + 0.35vw, 1.25rem);
            --fs-xl: clamp(1.25rem, 1.15rem + 0.55vw, 1.6rem);
            --fs-2xl: clamp(1.6rem, 1.35rem + 1.2vw, 2.35rem);
            --fs-problem: clamp(1.75rem, 1.1rem + 2.8vw, 3rem);
            --fs-score: clamp(1.75rem, 1.25rem + 2vw, 2.75rem);
            --fs-hero: clamp(2.25rem, 1.9rem + 1.6vw, 3.25rem);

            /* 間距與觸控尺寸 */
            --sp-1: 4px;
            --sp-2: 8px;
            --sp-3: 12px;
            --sp-4: 16px;
            --sp-5: 24px;
            --sp-6: 32px;
            --tap: 44px;
        }

        /* 深色模式：沿用同一組 token，只覆寫數值 */
        @media (prefers-color-scheme: dark) {
            :root {
                --c-bg-top: #070c1b;
                --c-bg-mid: #101a33;
                --c-bg-bottom: #09193c;
                --c-shell-top: #17456f;
                --c-shell-bottom: #0e2c4d;
                --c-ring-gold: #2a4a7a;
                --c-ring-flame: #143a63;

                --c-surface: #16203a;
                --c-surface-2: #1c2846;
                --c-surface-3: #27355c;
                --c-panel: rgba(18, 27, 51, 0.94);
                --c-tint-blue-1: #1a2942;
                --c-tint-blue-2: #16223a;

                --c-ink: #eef3ff;
                --c-ink-soft: #a9b6d4;
                --c-ink-invert: #ffffff;

                --c-primary: #38d6ff;
                --c-primary-deep: #0aa8d6;
                --c-accent: #ff8f63;
                --c-accent-deep: #e2602f;
                --c-success: #2ee79b;
                --c-success-deep: #12a866;
                --c-success-soft: #103a2c;
                --c-danger: #ff8f8f;
                --c-danger-soft: #3a1d22;
                --c-warning: #ffd75e;
                --c-warning-deep: #d9a200;
                --c-warning-soft: #3a3116;
                --c-purple: #c08bff;
                --c-purple-deep: #8b4fe0;
                --c-pink: #ff8fc4;
                --c-pink-deep: #e04a94;
                --c-focus: #7fd8ff;

                --grad-primary: linear-gradient(180deg, #1b7fae, #0d5578);
                --grad-accent: linear-gradient(180deg, #e2602f, #b0431a);
                --grad-success: linear-gradient(180deg, #17b877, #0a8c55);
                --grad-gold: linear-gradient(180deg, #e8b400, #b98200);
                --grad-purple: linear-gradient(180deg, #8b4fe0, #5f2fbd);
                --grad-pink: linear-gradient(180deg, #d8559a, #a82a6b);

                --shadow-1: 0 4px 10px rgba(0, 0, 0, 0.45);
                --shadow-2: 0 8px 20px rgba(0, 0, 0, 0.5);
                --shadow-3: 0 20px 60px rgba(0, 0, 0, 0.6);
            }
        }

        /* ==========================================================
           2. 基礎樣式與元件
           ========================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body { font-family: var(--font-body); font-size: var(--fs-md); background: linear-gradient(135deg, var(--c-bg-top) 0%, var(--c-bg-mid) 50%, var(--c-bg-bottom) 100%); min-height: 100vh; min-height: 100dvh; display: flex; justify-content: center; align-items: flex-start; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        /* --- 外殼 --- */
        .game-container { background: linear-gradient(180deg, var(--c-shell-top) 0%, var(--c-shell-bottom) 100%); border-radius: var(--r-xl); padding: clamp(16px, 3.2vw, 30px); box-shadow: var(--shadow-3), 0 0 0 8px var(--c-ring-gold), 0 0 0 16px var(--c-ring-flame); max-width: 1120px; width: 100%; margin: auto; position: relative; display: grid; gap: var(--sp-4); grid-template-columns: minmax(0, 1fr); grid-template-areas: "header" "level" "progress" "score" "settings" "problem" "history"; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        /* --- 標題與狀態列 --- */
        .header { grid-area: header; text-align: center; margin-bottom: 0; }
        .title { font-family: var(--font-display); font-size: var(--fs-2xl); line-height: 1.15; color: var(--c-ink-invert); text-shadow: 3px 3px 0 var(--c-accent), 6px 6px 0 var(--c-gold); margin-bottom: 10px; }
        .stats-row { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 0; }
        .streak-badge, .timer-display { background: var(--grad-accent); padding: 10px 25px; border-radius: 20px; font-family: var(--font-display); color: var(--c-ink-invert); font-size: var(--fs-lg); }
        .timer-display { background: var(--grad-primary); }
        .progress-bar { grid-area: progress; width: 100%; height: 20px; background: var(--c-surface-3); border-radius: 10px; margin-bottom: 0; overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,0.2); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ff88, var(--c-primary)); border-radius: 10px; transition: width 0.3s ease; }
        /* --- 等級與經驗值進度 --- */
        .level-info { grid-area: level; text-align: center; margin-bottom: 0; font-family: var(--font-display); color: var(--c-ink-invert); font-size: var(--fs-lg); }
        /* --- 計分板 --- */
        .score-board { grid-area: score; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); margin-bottom: 0; }
        .score-item { background: var(--grad-gold); padding: 15px clamp(8px, 2vw, 30px); border-radius: 20px; box-shadow: 0 6px 0 var(--c-gold-deep), var(--shadow-2); text-align: center; transform: rotate(-2deg); min-width: 0; }
        .score-item:last-child { transform: rotate(2deg); }
        .score-label { font-size: var(--fs-sm); color: var(--c-gold-ink); font-weight: 700; }
        .score-value { font-family: var(--font-display); font-size: var(--fs-score); line-height: 1.1; color: var(--c-ink-invert); text-shadow: 2px 2px 0 var(--c-gold-deep); overflow-wrap: anywhere; }
        /* --- 設定區與按鈕 --- */
        .settings { grid-area: settings; background: var(--c-panel); padding: 20px; border-radius: 20px; margin-bottom: 0; }
        .setting-row { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-bottom: 15px; }
        .setting-row:last-child { margin-bottom: 0; }
        .setting-label { font-weight: 700; color: var(--c-ink); display: flex; align-items: center; gap: 8px; width: 100%; justify-content: center; font-size: var(--fs-md); }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .btn { min-height: var(--tap); min-width: var(--tap); padding: 12px clamp(14px, 2.4vw, 24px); border: none; border-radius: 15px; font-family: var(--font-display); font-size: var(--fs-md); color: var(--c-ink-invert); cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease; box-shadow: 0 5px 0 rgba(0,0,0,0.2); -webkit-tap-highlight-color: transparent; }
        .btn:hover { filter: brightness(1.07); }
        .btn:focus-visible { outline: 3px solid var(--c-focus); outline-offset: 3px; }
        .btn:disabled, .btn[disabled] { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: 0 2px 0 rgba(0,0,0,0.18); filter: grayscale(0.35); }
        .btn.active { box-shadow: 0 0 0 3px var(--c-ink), 0 5px 0 rgba(0,0,0,0.2); transform: scale(1.04); }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
        .btn-primary { background: var(--grad-primary); color: var(--c-ink-invert); }
        .btn-success { background: var(--grad-success); color: var(--c-ink-invert); }
        .btn-random { background: var(--grad-pink); color: var(--c-ink-invert); }
        .btn-game { background: var(--grad-accent); color: var(--c-ink-invert); font-size: var(--fs-lg); padding: 16px clamp(24px, 4vw, 40px); min-height: 56px; }
        /* --- 題目區、答案欄與數字鍵盤 --- */
        .problem-area { grid-area: problem; display: flex; flex-direction: column; justify-content: center; gap: var(--sp-4); background: linear-gradient(180deg, var(--c-surface), var(--c-surface-2)); border-radius: 25px; padding: clamp(16px, 4vw, 30px); margin-bottom: 0; box-shadow: inset 0 5px 15px rgba(0,0,0,0.1); min-width: 0; }
        .problem-number { font-family: var(--font-display); font-size: var(--fs-problem); line-height: 1.2; color: var(--c-ink); text-align: center; margin-bottom: 20px; overflow-wrap: anywhere; min-width: 0; }
        .problem-num { color: var(--c-ink); }
        .problem-op { color: var(--c-accent); }
        .problem-slot { display: inline-block; min-width: 1.05em; color: var(--c-accent); border-bottom: 0.07em solid var(--c-accent); border-radius: 0.08em; }
        .input-area { display: flex; gap: 15px; justify-content: center; align-items: center; flex-wrap: wrap; }
        .keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(6px, 1.6vw, 12px); width: 100%; max-width: 420px; margin: 0 auto; }
        .key { min-height: 52px; min-width: var(--tap); border: 2px solid var(--c-surface-3); border-radius: var(--r-md); font-family: var(--font-display); font-size: var(--fs-xl); color: var(--c-ink); background: var(--c-surface); box-shadow: 0 4px 0 var(--c-surface-3); cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.2s ease; user-select: none; -webkit-tap-highlight-color: transparent; }
        .key:hover { background: var(--c-surface-2); }
        .key:focus-visible { outline: 3px solid var(--c-focus); outline-offset: 2px; }
        .key:disabled, .key[disabled] { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: 0 1px 0 var(--c-surface-3); }
        .key:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--c-surface-3); }
        .key--fn { background: var(--c-surface-3); color: var(--c-ink); font-size: var(--fs-lg); }
        .key--submit { background: var(--grad-success); color: var(--c-ink-invert); font-size: var(--fs-lg); border-color: var(--c-success-deep); box-shadow: 0 4px 0 var(--c-success-deep); }
        .key--submit:active { box-shadow: 0 1px 0 var(--c-success-deep); }
        .input-box { width: clamp(120px, 30vw, 190px); height: clamp(56px, 9vw, 74px); min-height: var(--tap); font-family: var(--font-display); font-size: var(--fs-xl); text-align: center; border: 4px solid var(--c-primary); border-radius: 15px; background: var(--c-surface); color: var(--c-ink); transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease; flex-shrink: 0; min-width: 0; }
        .input-box:focus { outline: none; border-color: var(--c-accent); box-shadow: 0 0 0 4px rgba(255,107,53,0.25); }
        .input-box:focus-visible { outline: 3px solid var(--c-focus); outline-offset: 3px; }
        .input-box.correct { border-color: var(--c-success); background: var(--c-success-soft); }
        .input-box.wrong { border-color: var(--c-danger); background: var(--c-danger-soft); }
        .input-box.warning { border-color: var(--c-warning); background: var(--c-warning-soft); animation: shake 0.5s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        /* --- 提示區 --- */
        .btn-hint { background: var(--grad-purple); color: var(--c-ink-invert); }
        .hint-area { background: var(--grad-purple); border-radius: 20px; padding: 20px; margin-top: 20px; display: none; }
        .hint-title { font-family: var(--font-display); font-size: var(--fs-lg); color: var(--c-ink-invert); margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .hint-content { background: var(--c-panel); padding: 15px; border-radius: 15px; color: var(--c-ink); line-height: 1.8; font-size: var(--fs-md); white-space: pre-line; }
        /* --- 遊戲記錄 --- */
        .history-section { grid-area: history; background: var(--c-panel); border-radius: 20px; padding: 20px; margin-top: 0; }
        .history-title { font-family: var(--font-display); font-size: var(--fs-lg); color: var(--c-ink); margin-bottom: 15px; text-align: center; }
        .history-list { max-height: 200px; overflow-y: auto; overflow-x: hidden; }
        .history-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 15px; background: linear-gradient(180deg, var(--c-surface-2), var(--c-surface-3)); border-radius: 12px; margin-bottom: 8px; font-family: var(--font-body); font-size: var(--fs-sm); }
        .history-item:nth-child(odd) { background: linear-gradient(180deg, var(--c-tint-blue-1), var(--c-tint-blue-2)); }
        .history-score { font-family: var(--font-display); color: var(--c-accent); font-size: var(--fs-md); }
        .history-time { color: var(--c-ink-soft); font-size: var(--fs-sm); }
        .no-history { text-align: center; color: var(--c-ink-soft); padding: 20px; font-size: var(--fs-sm); }
        /* --- 裝飾效果：彩帶、粒子、星星、升級字樣 --- */
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 1000; }
        .particle { position: absolute; font-size: 2rem; animation: fall 3s linear forwards; opacity: 0; }
        @keyframes fall { 0% { opacity: 1; transform: translateY(-50px) rotate(0deg); } 100% { opacity: 0; transform: translateY(100vh) rotate(360deg); } }
        .confetti { width: 15px; height: 15px; background: var(--c-gold); animation: confettiFall 2s linear forwards; }
        @keyframes confettiFall { 0% { transform: translateY(-50px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
        .level-up { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: var(--font-display); font-size: var(--fs-hero); color: var(--c-gold); text-shadow: 4px 4px 0 var(--c-accent), 8px 8px 0 #ff0000; animation: levelUp 2s ease forwards; z-index: 2000; pointer-events: none; }
        @keyframes levelUp { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); } }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1500; display: none; }
        .star { position: absolute; font-size: 3rem; animation: starBurst 1s ease forwards; }
        @keyframes starBurst { 0% { transform: scale(0) rotate(0deg); opacity: 1; } 100% { transform: scale(1.5) rotate(180deg); opacity: 0; } }

        /* ==========================================================
           4. 動效偏好：使用者要求減少動效時停止裝飾動畫
           ========================================================== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .particle, .confetti, .star { display: none !important; }
            .level-up { animation: none !important; }
        }

        /* ==========================================================
           3. 響應式版面：桌面闊屏採用兩欄（題目 / 側欄）
           ========================================================== */
        @media (min-width: 1024px) {
            .game-container {
                grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr);
                grid-template-areas:
                    "header   header"
                    "problem  level"
                    "problem  progress"
                    "problem  score"
                    "problem  settings"
                    "history  history";
                gap: var(--sp-5);
            }
            .score-board { grid-template-columns: minmax(0, 1fr); gap: var(--sp-3); }
            .history-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: var(--sp-2); align-content: start; max-height: 300px; }
            .history-item { margin-bottom: 0; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles" aria-hidden="true"></div>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <div class="game-container">
        <div class="header">
            <h1 class="title">🎮 數學大冒險 🎮</h1>
            <div class="stats-row">
                <div class="streak-badge"><span>🔥</span><span id="streak">0</span> 連勝</div>
                <div class="timer-display"><span>⏱️</span><span id="duration">00:00</span></div>
            </div>
        </div>
        <div class="level-info">🏆 等級 <span id="level">1</span> | 經驗值 <span id="xp">0</span>/<span id="xpNeeded">100</span></div>
        <div class="progress-bar" id="progressBar" role="progressbar" aria-label="經驗值進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
        <div class="score-board">
            <div class="score-item"><div class="score-label">⭐ 分數</div><div class="score-value" id="score">0</div></div>
            <div class="score-item"><div class="score-label">✅ 正確</div><div class="score-value" id="correct">0</div></div>
            <div class="score-item"><div class="score-label">❌ 錯誤</div><div class="score-value" id="wrong">0</div></div>
        </div>
        <div class="settings">
            <div class="setting-row">
                <div class="setting-label">🔢 數字位數：</div>
                <div class="btn-group" id="digitBtns">
                    <button class="btn btn-primary" data-digit="2" aria-pressed="false">2位數</button>
                    <button class="btn btn-primary" data-digit="3" aria-pressed="false">3位數</button>
                    <button class="btn btn-primary active" data-digit="4" aria-pressed="true">4位數</button>
                </div>
            </div>
            <div class="setting-row">
                <div class="setting-label">🎯 題目類型：</div>
                <div class="btn-group" id="inputBtns">
                    <button class="btn btn-success" data-input="result" aria-pressed="false">求結果</button>
                    <button class="btn btn-success" data-input="a" aria-pressed="false">求被加/減數</button>
                    <button class="btn btn-success" data-input="b" aria-pressed="false">求加/減數</button>
                    <button class="btn btn-random" data-input="random" aria-pressed="false">🔀 隨機</button>
                </div>
            </div>
            <div class="setting-row"><button class="btn btn-game" onclick="startGame()">🚀 開始挑戰！</button></div>
        </div>
        <div class="problem-area" id="problemArea" style="display: none;">
            <div class="problem-number" id="problem" role="status" aria-live="polite"></div>
            <div class="input-area">
                <input type="number" class="input-box" id="answer" placeholder="?" aria-label="答案" onkeypress="handleKeyPress(event)">
                <button class="btn btn-success" onclick="checkAnswer()">✅ 確定</button>
                <button class="btn btn-hint" onclick="showHint()">💡 提示</button>
            </div>
            <div class="keypad" id="keypad" role="group" aria-label="數字鍵盤">
                <button type="button" class="key" data-key="1">1</button>
                <button type="button" class="key" data-key="2">2</button>
                <button type="button" class="key" data-key="3">3</button>
                <button type="button" class="key" data-key="4">4</button>
                <button type="button" class="key" data-key="5">5</button>
                <button type="button" class="key" data-key="6">6</button>
                <button type="button" class="key" data-key="7">7</button>
                <button type="button" class="key" data-key="8">8</button>
                <button type="button" class="key" data-key="9">9</button>
                <button type="button" class="key key--fn" data-key="backspace" aria-label="刪除最後一個數字">⌫</button>
                <button type="button" class="key" data-key="0">0</button>
                <button type="button" class="key key--submit" data-key="enter" aria-label="提交答案">⏎</button>
            </div>
            <div class="hint-area" id="hintArea">
                <div class="hint-title">💡 提示</div>
                <div class="hint-content" id="hintContent"></div>
            </div>
        </div>
        <div class="history-section">
            <div class="history-title">📋 過往5次遊戲記錄</div>
            <div class="history-list" id="historyList">
                <div class="no-history">暫時沒有遊戲記錄</div>
            </div>
        </div>
    </div>
    <div class="level-up" id="levelUp" style="display: none;">⬆️ 升級！</div>
    <script>
        let gameState = { digit: 4, inputType: 'result', score: 0, correct: 0, wrong: 0, streak: 0, xp: 0, level: 1, currentProblem: null, startTime: null, timerInterval: null, history: [], answerLocked: false };
        
        const sounds = { correct: null, wrong: null, click: null, levelUp: null, streak: null, warning: null };
        let audioCtx = null;
        
        // 瀏覽器的自動播放政策要求 AudioContext 在使用者互動後建立或恢復
        function getAudioCtx() {
            if (!audioCtx) {
                const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextCtor) return null;
                try {
                    audioCtx = new AudioContextCtor();
                } catch (err) {
                    return null;
                }
            }
            if (audioCtx.state === 'suspended') {
                try {
                    const resuming = audioCtx.resume();
                    if (resuming && resuming.catch) resuming.catch(() => {});
                } catch (err) {
                    // 瀏覽器仍未允許播放，靜音運作
                }
            }
            return audioCtx;
        }
        
        function initAudio() {
            sounds.correct = () => {
                const ctx = getAudioCtx();
                if (!ctx) return;
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.4);
            };
            sounds.wrong = () => {
                const ctx = getAudioCtx();
                if (!ctx) return;
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                osc.frequency.setValueAtTime(150, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.4);
            };
            sounds.warning = () => {
                const ctx = getAudioCtx();
                if (!ctx) return;
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.setValueAtTime(440, ctx.currentTime + 0.15);
                osc.frequency.setValueAtTime(440, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.5);
            };
            sounds.click = () => {
                const ctx = getAudioCtx();
                if (!ctx) return;
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.1);
            };
            // 升級提示音：沿用相同音色與包絡的上行琶音
            sounds.levelUp = () => {
                const ctx = getAudioCtx();
                if (!ctx) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const start = ctx.currentTime + i * 0.12;
                    const osc = ctx.createOscillator(), gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(freq, start);
                    gain.gain.setValueAtTime(0.3, start);
                    gain.gain.exponentialRampToValueAtTime(0.01, start + 0.3);
                    osc.start(start); osc.stop(start + 0.3);
                });
            };
            // 連勝提示音：兩音上行的短促提示
            sounds.streak = () => {
                const ctx = getAudioCtx();
                if (!ctx) return;
                [880.00, 1174.66].forEach((freq, i) => {
                    const start = ctx.currentTime + i * 0.09;
                    const osc = ctx.createOscillator(), gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(freq, start);
                    gain.gain.setValueAtTime(0.25, start);
                    gain.gain.exponentialRampToValueAtTime(0.01, start + 0.18);
                    osc.start(start); osc.stop(start + 0.18);
                });
            };
        }
        
        // 第一次使用者互動時啟用音訊，之後每次互動都嘗試恢復被暫停的 AudioContext
        ['pointerdown', 'touchstart', 'keydown'].forEach(evt => {
            window.addEventListener(evt, () => { getAudioCtx(); }, { passive: true });
        });
        
        document.getElementById('digitBtns').addEventListener('click', e => {
            if (e.target.classList.contains('btn')) {
                document.querySelectorAll('#digitBtns .btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
                e.target.classList.add('active');
                e.target.setAttribute('aria-pressed', 'true');
                gameState.digit = parseInt(e.target.dataset.digit);
                sounds.click && sounds.click();
            }
        });
        
        document.getElementById('inputBtns').addEventListener('click', e => {
            if (e.target.classList.contains('btn')) {
                document.querySelectorAll('#inputBtns .btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
                e.target.classList.add('active');
                e.target.setAttribute('aria-pressed', 'true');
                gameState.inputType = e.target.dataset.input;
                sounds.click && sounds.click();
            }
        });
        
        function startGame() {
            if (gameState.correct > 0 || gameState.wrong > 0) {
                const dur = gameState.startTime ? Math.floor((Date.now() - gameState.startTime) / 1000) : 0;
                const m = Math.floor(dur / 60), s = dur % 60;
                const durStr = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                gameState.history.unshift({ score: gameState.score, correct: gameState.correct, wrong: gameState.wrong, duration: durStr });
                if (gameState.history.length > 5) gameState.history.pop();
                updateHistoryDisplay();
            }
            // 保留 XP 和等級，只重置分數和連勝
            const savedXp = gameState.xp;
            const savedLevel = gameState.level;
            gameState.score = 0; gameState.correct = 0; gameState.wrong = 0; gameState.streak = 0; gameState.xp = savedXp; gameState.level = savedLevel; gameState.startTime = Date.now();
            updateDisplay();
            updateTimer();
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(updateTimer, 1000);
            document.getElementById('problemArea').style.display = 'block';
            unlockAnswer();
            sounds.click && sounds.click();
            generateProblem();
        }
        
        function updateTimer() {
            if (!gameState.startTime) return;
            const dur = Math.floor((Date.now() - gameState.startTime) / 1000);
            const m = Math.floor(dur / 60), s = dur % 60;
            document.getElementById('duration').textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        
        function updateHistoryDisplay() {
            const h = document.getElementById('historyList');
            if (gameState.history.length === 0) {
                h.innerHTML = '<div class="no-history">暫時沒有遊戲記錄</div>';
                return;
            }
            h.innerHTML = gameState.history.map(s => `
                <div class="history-item">
                    <span class="history-score">⭐ ${s.score} 分</span>
                    <span>${s.correct}✅ ${s.wrong}❌</span>
                    <span class="history-time">⏱️ ${s.duration}</span>
                </div>
            `).join('');
        }
        
        function generateProblem() {
            const d = gameState.digit, min = Math.pow(10, d - 1), max = Math.pow(10, d) - 1;
            const a = Math.floor(Math.random() * (max - min + 1)) + min;
            const b = Math.floor(Math.random() * (max - min + 1)) + min;
            const isAdd = Math.random() > 0.5;
            let it = gameState.inputType;
            if (it === 'random') {
                const ts = ['result', 'a', 'b'];
                it = ts[Math.floor(Math.random() * ts.length)];
            }
            if (isAdd) {
                gameState.currentProblem = { type: 'add', a, b, result: a + b, inputType: it };
            } else {
                if (a < b) {
                    gameState.currentProblem = { type: 'sub', a: b, b: a, result: b - a, inputType: it };
                } else {
                    gameState.currentProblem = { type: 'sub', a, b, result: a - b, inputType: it };
                }
            }
            displayProblem();
            document.getElementById('hintArea').style.display = 'none';
            document.getElementById('answer').value = '';
            document.getElementById('answer').focus();
            unlockAnswer();
        }
        
        function displayProblem() {
            const p = gameState.currentProblem;
            if (!p) return;
            const op = p.type === 'add' ? '+' : '-';
            let tokens;
            if (p.inputType === 'result') tokens = [String(p.a), op, String(p.b), '=', '?'];
            else if (p.inputType === 'a') tokens = ['?', op, String(p.b), '=', String(p.result)];
            else tokens = [String(p.a), op, '?', '=', String(p.result)];
            const box = document.getElementById('problem');
            box.textContent = '';
            tokens.forEach((token, i) => {
                const span = document.createElement('span');
                span.className = token === '?' ? 'problem-slot' : (token === '+' || token === '-' ? 'problem-op' : 'problem-num');
                span.textContent = i < tokens.length - 1 ? token + ' ' : token;
                box.appendChild(span);
            });
        }
        
        function handleKeyPress(e) { if (e.key === 'Enter') checkAnswer(); }

        // 數字鍵盤：讓觸控裝置可以直接點擊數字作答，支援退格與送出
        const keypadEl = document.querySelector('#keypad');
        if (keypadEl) {
            keypadEl.addEventListener('click', e => {
                const key = e.target.closest('.key');
                if (!key || !keypadEl.contains(key)) return;
                handleKeypad(key.dataset.key);
            });
        }

        function maxAnswerLength() {
            const p = gameState.currentProblem;
            const d = gameState.digit;
            if (p && p.inputType === 'result') return d + 1;
            return d;
        }

        function handleKeypad(key) {
            if (!key) return;
            if (key === 'enter') { checkAnswer(); return; }
            if (gameState.answerLocked) return;
            const box = document.getElementById('answer');
            if (!box) return;
            if (key === 'backspace') {
                box.value = box.value.slice(0, -1);
            } else if (/^[0-9]$/.test(key)) {
                if (box.value === '' && key === '0') return;
                if (box.value.length >= maxAnswerLength()) {
                    box.classList.add('warning');
                    setTimeout(() => box.classList.remove('warning'), 400);
                    return;
                }
                box.value += key;
            } else {
                return;
            }
            sounds.click && sounds.click();
            box.focus({ preventScroll: true });
        }
        
        function lockAnswer() {
            gameState.answerLocked = true;
            document.querySelectorAll('#problemArea .btn, #problemArea .key').forEach(el => { el.disabled = true; });
        }

        function unlockAnswer() {
            gameState.answerLocked = false;
            document.querySelectorAll('#problemArea .btn, #problemArea .key').forEach(el => { el.disabled = false; });
        }

        function checkAnswer() {
            if (gameState.answerLocked) return;
            if (!gameState.currentProblem) return;
            const val = document.getElementById('answer').value.trim();
            const box = document.getElementById('answer');
            if (!val) {
                box.classList.add('warning');
                sounds.warning && sounds.warning();
                document.getElementById('hintContent').textContent = '請輸入答案！';
                document.getElementById('hintArea').style.display = 'block';
                setTimeout(() => { box.classList.remove('warning'); document.getElementById('hintArea').style.display = 'none'; }, 1000);
                return;
            }
            if (!/^\d+$/.test(val)) {
                // 只接受非負整數，避免小數或科學記號被 parseInt 截斷成另一個答案
                box.classList.add('warning');
                sounds.warning && sounds.warning();
                document.getElementById('hintContent').textContent = '請輸入數字答案！';
                document.getElementById('hintArea').style.display = 'block';
                setTimeout(() => { box.classList.remove('warning'); document.getElementById('hintArea').style.display = 'none'; }, 1000);
                return;
            }
            const num = parseInt(val, 10);
            if (num === gameState.currentProblem.result) {
                box.classList.add('correct');
                sounds.correct && sounds.correct();
                createParticles('⭐'); createConfetti();
                gameState.score += 10 + gameState.streak * 2;
                gameState.correct++; gameState.streak++;
                gameState.xp += 10 + Math.floor(gameState.streak / 3) * 5;
                const xpNeed = gameState.level * 100;
                if (gameState.xp >= xpNeed) {
                    gameState.level++; gameState.xp -= xpNeed;
                    showLevelUp(); sounds.levelUp && sounds.levelUp(); createStarBurst();
                }
                if (gameState.streak >= 3) sounds.streak && sounds.streak();
                lockAnswer();
                setTimeout(() => { box.classList.remove('correct'); unlockAnswer(); generateProblem(); }, 1000);
            } else {
                box.classList.add('wrong');
                sounds.wrong && sounds.wrong();
                gameState.wrong++; gameState.streak = 0;
                createParticles('❌');
                lockAnswer();
                setTimeout(() => {
                    box.classList.remove('wrong');
                    unlockAnswer();
                    generateProblem();
                }, 800);
            }
            updateDisplay();
        }
        
        function showHint() {
            const p = gameState.currentProblem;
            if (!p) return;
            let h = '';
            if (p.inputType === 'result') {
                h = p.type === 'add' 
                    ? `加法提示：\n${p.a} + ${p.b}\n可以試吓由 ${p.a} 開始，向上數 ${p.b} 步`
                    : `減法提示：\n${p.a} - ${p.b}\n可以試吓由 ${p.a} 開始，向下數 ${p.b} 步`;
            } else if (p.inputType === 'a') {
                h = p.type === 'add'
                    ? `求被加數：\n結果 ${p.result} - 加數 ${p.b} = 被加數\n即係 ${p.result} - ${p.b} = ${p.a}`
                    : `求被減數：\n結果 ${p.result} + 減數 ${p.b} = 被減數\n即係 ${p.result} + ${p.b} = ${p.a}`;
            } else {
                h = p.type === 'add'
                    ? `求加數：\n結果 ${p.result} - 被加數 ${p.a} = 加數\n即係 ${p.result} - ${p.a} = ${p.b}`
                    : `求減數：\n被減數 ${p.a} - 結果 ${p.result} = 減數\n即係 ${p.a} - ${p.result} = ${p.b}`;
            }
            document.getElementById('hintContent').textContent = h;
            document.getElementById('hintArea').style.display = 'block';
            sounds.click && sounds.click();
        }
        
        function updateDisplay() {
            ['score', 'correct', 'wrong', 'streak', 'level', 'xp'].forEach(k => document.getElementById(k).textContent = gameState[k]);
            document.getElementById('xpNeeded').textContent = gameState.level * 100;
            const pct = Math.max(0, Math.min(100, (gameState.xp / (gameState.level * 100)) * 100));
            document.getElementById('progressFill').style.width = `${pct}%`;
            const bar = document.querySelector('#progressBar');
            if (bar) bar.setAttribute('aria-valuenow', String(Math.round(pct)));
            saveProgress();
        }
        
        function saveProgress() {
            try {
                localStorage.setItem('robloxMath_xp', gameState.xp);
                localStorage.setItem('robloxMath_level', gameState.level);
            } catch (err) {
                // 無痕模式、配額已滿或瀏覽器封鎖儲存時忽略寫入，遊戲仍然可以繼續進行
            }
        }
        
        function loadProgress() {
            try {
                const savedXp = localStorage.getItem('robloxMath_xp');
                const savedLevel = localStorage.getItem('robloxMath_level');
                const xp = parseInt(savedXp, 10);
                const level = parseInt(savedLevel, 10);
                if (savedXp !== null && Number.isFinite(xp) && xp >= 0) gameState.xp = xp;
                if (savedLevel !== null && Number.isFinite(level) && level >= 1) gameState.level = level;
            } catch (err) {
                // 讀取失敗時以預設值開始
            }
        }
        
        function createParticles(emoji) {
            for (let i = 0; i < 10; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.textContent = emoji;
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 0.5 + 's';
                document.getElementById('particles').appendChild(p);
                setTimeout(() => p.remove(), 3000);
            }
        }
        
        function createConfetti() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + '%';
                c.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
                c.style.animationDelay = Math.random() * 0.5 + 's';
                container.appendChild(c);
                setTimeout(() => c.remove(), 2000);
            }
        }
        
        function showLevelUp() {
            const lu = document.getElementById('levelUp');
            lu.style.display = 'block';
            setTimeout(() => lu.style.display = 'none', 2000);
        }
        
        function createStarBurst() {
            const s = document.getElementById('stars');
            s.style.display = 'block';
            ['⭐', '🌟', '💫', '✨'].forEach((e, i) => {
                const st = document.createElement('div');
                st.className = 'star';
                st.textContent = e;
                st.style.left = Math.random() * 100 + '%';
                st.style.top = Math.random() * 100 + '%';
                st.style.animationDelay = Math.random() * 0.5 + 's';
                s.appendChild(st);
                setTimeout(() => st.remove(), 1000);
            });
            setTimeout(() => s.style.display = 'none', 1500);
        }
        
        initAudio();
        loadProgress();
        updateDisplay();
    </script>
</body>
</html>
